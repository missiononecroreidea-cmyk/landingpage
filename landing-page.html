  <style>
    :root {
      --background: #ffffff;
      --foreground: #111b21;
      --muted: #f0f2f5;
      --muted-foreground: #667781;
      --primary: #25d366;
      --primary-foreground: #ffffff;
      --border: #d1d7db;
      --input: #d1d7db;
      --ring: #25d366;
      --gold: #d4af37;
      --radius: 0.625rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 80rem;
      margin: 0 auto;
      display: flex;
      height: 4rem;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo svg {
      width: 2rem;
      height: 2rem;
      color: var(--primary);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .nav {
      display: none;
      align-items: center;
      gap: 2rem;
    }

    .nav a {
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-outline {
      border-color: var(--input);
      background-color: transparent;
      color: var(--foreground);
    }

    .btn-outline:hover {
      background-color: var(--muted);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: #1da851;
    }

    .btn-lg {
      height: 3rem;
      width: 100%;
      font-size: 1rem;
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--foreground);
      border-color: var(--foreground);
    }

    .btn-ghost:hover {
      background-color: var(--muted);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 28rem;
      text-align: center;
    }

    .avatar {
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      border: 4px solid var(--gold);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      margin: 0 auto;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      margin-top: 1.5rem;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .title span {
      font-weight: 400;
      color: var(--muted-foreground);
    }

    .message-bubble {
      margin-top: 2rem;
      width: 100%;
      border-radius: 1rem;
      background-color: var(--muted);
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .message-bubble p {
      font-size: 1rem;
      font-weight: 500;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .footer-link {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: var(--primary);
    }

    .footer-link svg {
      width: 1.25rem;
      height: 1.25rem;
      color: var(--primary);
    }

    .footer-link .highlight {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (min-width: 640px) {
      .header-inner {
        padding: 0 1.5rem;
      }

      .nav {
        display: flex;
      }

      .btn-login {
        display: inline-flex;
      }

      .avatar {
        width: 8rem;
        height: 8rem;
      }

      .title {
        font-size: 1.875rem;
      }

      .message-bubble p {
        font-size: 1.125rem;
      }
    }

    @media (max-width: 639px) {
      .btn-login {
        display: none;
      }
    }
  </style>
</head>
